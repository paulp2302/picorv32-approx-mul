name: HW Multiplier Simulation

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Set up OSS CAD Suite (Yosys, Icarus Verilog)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run simulation sweep
        run: .github/scripts/run_sim_sweep.sh sim

      - name: Run synthesized simulation sweep
        run: .github/scripts/run_sim_sweep.sh sim-synth
