name: Update Specs Table

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7

      - name: Set up OSS CAD Suite (Yosys, NextPNR, Icarus Verilog, Python)
        uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          python-override: true
          version: 2026-08-27
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install RISC-V cross-compiler (for full-SoC firmware)
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Install accuracy analysis dependencies
        run: python3 -m pip install -r HW/REF/requirements.txt

      - name: Collect accuracy metrics
        run: python3 .github/scripts/collect_accuracy.py

      - name: Collect isolated PnR metrics (Mul LUTs, Isolated Fmax)
        run: python3 .github/scripts/collect_pnr.py

      - name: Collect full-SoC PnR metrics (Total LUTs, System Clock Fmax)
        run: python3 .github/scripts/collect_soc_pnr.py

      - name: Open PR with updated specs.csv
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- specs.csv)" ]; then
            echo "specs.csv unchanged, nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="bot/update-specs-table"
          git checkout -B "$BRANCH"
          git add specs.csv
          git commit -m "chore: Update specs.csv"
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR already open for $BRANCH; branch updated in place."
          else
            gh pr create \
              --title "Update specs.csv" \
              --body "Automated specs.csv refresh from a manual run of the Update Specs Table workflow." \
              --base master \
              --head "$BRANCH"
          fi
